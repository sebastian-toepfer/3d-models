; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env]
lib_deps =
	symlink://lib_deps/gpio
	symlink://lib_deps/time
	symlink://lib_deps/memory
extra_scripts = pre:scripts/explicit_library_sources.py
custom_explicit_library_include_dirs =
	lib_deps/time/src
	lib_deps/memory/include

[env:test_native]
platform = native
test_framework = unity
custom_explicit_library_sources =
	lib_deps/time_test/src
	lib_deps/memory_malloc/src
lib_deps =
	${env.lib_deps}
	symlink://lib_deps/gpio_test

[env:mkrwan1310]
platform = atmelsam
board = mkrwan1310
test_ignore = *
framework = arduino
platform_packages = platformio/toolchain-gccarmnoneeabi@1.140201.0
custom_explicit_library_sources =
	lib_deps/time_arduino/src
	lib_deps/memory_malloc/src
lib_deps = 
	${env.lib_deps}
	symlink://lib_deps/gpio_samd21
	arduino-libraries/MKRWAN@^1.1.1
	arduino-libraries/ArduinoECCX08@^1.3.8
